name: Release

# Runs only when a maintainer pushes a version tag (v0.1.0, v0.2.0-rc.1, ...). See docs/RELEASING.md.
# No registry tokens are stored: PyPI and npm use OIDC trusted publishing, GHCR uses GITHUB_TOKEN.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Versions match the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/version.py check "${GITHUB_REF_NAME}"
      - id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          [[ "$v" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

  pypi:
    name: PyPI (agentspace-sdk)
    needs: check
    runs-on: ubuntu-latest
    environment: pypi # add required reviewers here for a manual gate
    permissions:
      id-token: write # trusted publishing
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-python/dist

  npm:
    name: npm (agentspace-sdk)
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # trusted publishing + provenance
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5
      - run: pnpm install --frozen-lockfile --filter agentspace-sdk...
      - run: pnpm --filter agentspace-sdk test
      - run: pnpm --filter agentspace-sdk build
      - working-directory: packages/sdk-ts
        run: npm publish --provenance --access public --tag ${{ needs.check.outputs.prerelease == 'true' && 'next' || 'latest' }}

  images:
    name: Docker images (GHCR)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        image: [collector, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentspace-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.check.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.check.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image == 'collector' && 'server' || 'web' }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  github-release:
    name: GitHub release
    needs: [check, pypi, npm, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          ${{ needs.check.outputs.prerelease == 'true' && '--prerelease' || '' }}
