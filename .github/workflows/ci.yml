name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  adapters:
    name: Adapter ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: openai-agents
            tests: tests/test_openai_agents_adapter.py
          - group: crewai
            tests: tests/test_crewai_adapter.py
          - group: claude-agent-sdk
            tests: tests/test_claude_agent_sdk_adapter.py
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --group ${{ matrix.group }}
      # The adapter's own conformance tests, plus the whole suite with that framework installed.
      - run: uv run pytest -q ${{ matrix.tests }}
      - run: uv run pytest -q

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test

  generated:
    name: Generated types are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: cd packages/sdk-python && uv sync --locked
      - run: make check-generated

  examples:
    name: Example ${{ matrix.example }} (no collector)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: langgraph-dev-team
            args: --fake --runs 2 --latency 0
          - example: crewai-research-desk
            args: --fake --latency 0
          - example: openai-agents-handoffs
            args: --fake --latency 0
          - example: claude-agent-sdk-support
            args: --replay --delay 0
          - example: otel-generic
            args: --latency 0
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      # Nothing listens on :4899, so this proves instrumentation never crashes the host app.
      - run: uv run python main.py ${{ matrix.args }}
        env:
          AGENTSPACE_URL: http://127.0.0.1:4899
