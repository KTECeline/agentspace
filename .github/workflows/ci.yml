name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # every commit, not just the tip
      # The official image, pinned; no action license or token needed. Fails the build on any finding.
      - run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  adapters:
    name: Adapter ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: openai-agents
            tests: tests/test_openai_agents_adapter.py
          - group: crewai
            tests: tests/test_crewai_adapter.py
          - group: claude-agent-sdk
            tests: tests/test_claude_agent_sdk_adapter.py
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --group ${{ matrix.group }}
      # The adapter's own conformance tests, plus the whole suite with that framework installed.
      - run: uv run pytest -q ${{ matrix.tests }}
      - run: uv run pytest -q

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test

  generated:
    name: Generated types are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: cd packages/sdk-python && uv sync --locked
      - run: make check-generated

  examples:
    name: Example ${{ matrix.example }} (no collector)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: langgraph-dev-team
            args: --fake --runs 2 --latency 0
          - example: crewai-research-desk
            args: --fake --latency 0
          - example: openai-agents-handoffs
            args: --fake --latency 0
          - example: claude-agent-sdk-support
            args: --replay --delay 0
          # No collector: the refund approval must fail closed (refused), not hang.
          - example: claude-agent-sdk-support
            args: --replay --approve --delay 0
          - example: otel-generic
            args: --latency 0
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      # Nothing listens on :4899, so this proves instrumentation never crashes the host app.
      - run: uv run python main.py ${{ matrix.args }}
        env:
          AGENTSPACE_URL: http://127.0.0.1:4899

  docker:
    name: Docker images (build + size budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          docker buildx build --load -f server/Dockerfile -t agentspace-collector:ci .
          docker buildx build --load -f web/Dockerfile -t agentspace-web:ci .
      - name: Size budget (under 250 MB each)
        run: |
          for img in agentspace-collector:ci agentspace-web:ci; do
            bytes=$(docker image inspect "$img" --format '{{.Size}}')
            echo "$img: $((bytes / 1000000)) MB"
            [ "$bytes" -lt 250000000 ] || { echo "::error::$img is over budget"; exit 1; }
          done
      - name: Smoke test
        run: |
          docker run -d --name as-collector -p 4800:4800 agentspace-collector:ci
          docker run -d --name as-web -p 4801:4801 agentspace-web:ci
          for _ in $(seq 1 30); do curl -fs localhost:4800/healthz && curl -fs -o /dev/null localhost:4801/demo && break; sleep 1; done
          curl -fsS localhost:4800/v1/pricing | head -c 200; echo
          curl -fsS -o /dev/null -w "web /demo %{http_code}\n" localhost:4801/demo
          curl -fsS -o /dev/null -w "web /dashboard %{http_code}\n" localhost:4801/dashboard
      - name: Container logs
        if: failure()
        run: docker logs as-collector; docker logs as-web
