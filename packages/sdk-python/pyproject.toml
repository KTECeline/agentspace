[project]
name = "agentspace-sdk"
version = "0.1.0.dev0"
description = "Debug, observe and control multi-agent systems: a live office for your agent teams, with detectors, an oversight policy and run comparison."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "AgentSpace contributors" }]
keywords = ["agents", "llm", "observability", "langgraph", "multi-agent", "opentelemetry"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Framework adapters need no extras: they turn on when your app already has the framework.
models = ["pydantic>=2.5"]

[project.urls]
Homepage = "https://github.com/KTECeline/agentspace"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "pydantic>=2.5",
  "jsonschema>=4.22",
  "datamodel-code-generator>=0.26",
  "langchain-core>=0.3",
  "langgraph>=0.2",
]
# One group per framework adapter, so heavy frameworks never have to co-install.
openai-agents = ["openai-agents>=0.22"]
crewai = ["crewai>=1.10; python_version < '3.14'"]
claude-agent-sdk = ["claude-agent-sdk>=0.2"]

[tool.uv]
# Framework groups are installed one at a time (one CI job each), so let each resolve to its
# own newest versions instead of forcing one shared set of transitive pins.
conflicts = [[{ group = "openai-agents" }, { group = "crewai" }, { group = "claude-agent-sdk" }]]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentspace"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["agentspace/models/_generated.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["agentspace"]
exclude = ["agentspace/models/_generated\\.py"]

[[tool.mypy.overrides]]
# Framework adapters: the frameworks are optional (usually not installed when type checking).
module = ["langchain_core.*", "langgraph.*", "agents.*", "openai.*", "crewai.*", "claude_agent_sdk.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# Adapters subclass framework base classes, which are untyped (skipped) above.
module = ["agentspace.adapters.*"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:crewai.*", "ignore::DeprecationWarning:pydantic.*"]
