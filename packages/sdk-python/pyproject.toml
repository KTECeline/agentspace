[project]
name = "agentspace-sdk"
version = "0.1.0.dev0"
description = "Live office for AI agent teams: see every agent think, call tools, hand off, and cost money."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "AgentSpace contributors" }]
keywords = ["agents", "llm", "observability", "langgraph", "multi-agent", "opentelemetry"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
models = ["pydantic>=2.5"]
langgraph = ["langchain-core>=0.3"]

[project.urls]
Homepage = "https://github.com/KTECeline/agentspace"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "pydantic>=2.5",
  "jsonschema>=4.22",
  "datamodel-code-generator>=0.26",
  "langchain-core>=0.3",
  "langgraph>=0.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentspace"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["agentspace/models/_generated.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["agentspace"]
exclude = ["agentspace/models/_generated\\.py"]

[[tool.mypy.overrides]]
module = ["langchain_core.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
