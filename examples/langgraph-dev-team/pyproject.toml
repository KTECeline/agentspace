[project]
name = "langgraph-dev-team"
version = "0.1.0"
description = "AgentSpace example: a LangGraph dev team fixing a seeded bug."
requires-python = ">=3.10"
dependencies = [
  "agentspace",
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain-anthropic>=1.0",
  "python-dotenv>=1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
agentspace = { path = "../../packages/sdk-python", editable = true }
