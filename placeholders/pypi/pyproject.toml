[project]
name = "agentspace"
version = "0.0.1"
description = "Name reservation for AgentSpace, a live office for AI agent teams. The real SDK ships as 0.1.0."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = ["Development Status :: 1 - Planning"]

[project.urls]
Homepage = "https://github.com/KTECeline/agentspace"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
